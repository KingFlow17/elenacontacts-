<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Елена Микулина | Интегративный нутрициолог</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #f7f4ee;
      --card-bg: rgba(253, 251, 247, 0.92);
      --text-dark: #222522;
      --text-sub: #5f655e;
      --border-soft: #c8c2b5;
      --border-inner: #ded8cb;
      --olive-dark: #3a4b3d;
      --olive-accent: #5c6f5a;
      --olive-light: #778b73;
      --sage-tint: #97a892;
      --gold-tint: #c5b58d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-cream);
      /* Мягкие акварельные разводы в углах */
      background-image: 
        radial-gradient(ellipse at 15% 15%, rgba(151, 168, 146, 0.45) 0%, rgba(197, 181, 141, 0.25) 35%, transparent 70%),
        radial-gradient(ellipse at 85% 90%, rgba(197, 181, 141, 0.35) 0%, rgba(119, 139, 115, 0.2) 40%, transparent 65%),
        radial-gradient(circle at 50% 50%, #fbf9f4 0%, var(--bg-cream) 100%);
      font-family: 'Montserrat', sans-serif;
      padding: 24px 16px;
      color: var(--text-dark);
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 18px;
      padding: 44px 28px 36px;
      text-align: center;
      box-shadow: 
        0 15px 35px -10px rgba(58, 75, 61, 0.12),
        0 0 0 1px var(--border-soft);
      overflow: hidden;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* Декоративная двойная рамка в стиле визитки */
    .card::before {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid var(--border-inner);
      border-radius: 12px;
      pointer-events: none;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 16px;
      border: 0.5px solid rgba(197, 181, 141, 0.5);
      border-radius: 10px;
      pointer-events: none;
    }

    /* Фоновый акварельный мазок и веточка оливы */
    .botanical-bg {
      position: absolute;
      top: -20px;
      left: -20px;
      width: 220px;
      height: 220px;
      opacity: 0.28;
      pointer-events: none;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.15;
      text-transform: uppercase;
      color: var(--text-dark);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-bottom: 24px;
      position: relative;
      padding-bottom: 16px;
    }

    .subtitle::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-tint), transparent);
    }

    .phone-text {
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      margin-bottom: 28px;
    }

    .phone-text a {
      color: var(--text-dark);
      text-decoration: none;
      font-weight: 500;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      transition: all 0.25s ease;
    }

    .btn:active {
      transform: scale(0.985);
    }

    /* Кнопка WhatsApp в природном оливковом стиле */
    .btn-whatsapp {
      background: linear-gradient(135deg, #445d48, #304434);
      color: #f7f5f0;
      box-shadow: 0 6px 18px -4px rgba(48, 68, 52, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-whatsapp:hover {
      background: linear-gradient(135deg, #4f6b54, #3a513e);
      box-shadow: 0 8px 22px -3px rgba(48, 68, 52, 0.45);
      transform: translateY(-1px);
    }

    /* Кнопка Telegram в шалфейно-приглушенном оттенке */
    .btn-telegram {
      background: linear-gradient(135deg, #536f7a, #3b535d);
      color: #f7f5f0;
      box-shadow: 0 6px 18px -4px rgba(59, 83, 93, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-telegram:hover {
      background: linear-gradient(135deg, #607f8b, #455f6b);
      box-shadow: 0 8px 22px -3px rgba(59, 83, 93, 0.45);
      transform: translateY(-1px);
    }

    .btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .note {
      margin-top: 22px;
      font-size: 0.78rem;
      color: #8c928b;
      letter-spacing: 0.04em;
    }
  </style>
</head>
